[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rgb2nir-pix2pix"
version = "0.1.0"
description = "Pix2Pix cGAN for RGB-to-NIR skin crop translation."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Ali Keivanmarz" },
  { name = "Hamid Sharifzadeh" },
]
dependencies = [
  "numpy",
  "pandas",
  "Pillow",
  "PyYAML",
  "tqdm",
  "torch",
  "torchvision",
  "scikit-image",
  "matplotlib",
  "opencv-python-headless",
  "safetensors",
]

[project.urls]
Repository = "https://github.com/alikeivanmarz/pix2pix-rgb2nir-cgan"
Publication = "https://doi.org/10.1016/j.forsciint.2024.112050"
ScienceDirect = "https://www.sciencedirect.com/science/article/pii/S0379073824001312"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
