[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rgb2nir-pix2pix"
version = "0.1.0"
description = "Pix2Pix cGAN for RGB-to-NIR skin crop translation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "Pillow",
  "PyYAML",
  "tqdm",
  "torch",
  "torchvision",
  "scikit-image",
  "matplotlib",
  "opencv-python-headless",
  "safetensors",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
